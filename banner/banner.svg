<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">procedures, the public copy</title>
  <desc id="d">Only the procedures the owner has listed for visitors. The picture: 9 numbered stops on a line that climbs, each arriving in turn. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block everything is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .draw { stroke-dasharray: 100; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .arrive { animation: arrive .5s ease-out both; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 8s steps(48) 3s infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s steps(60) 3.6s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    @keyframes halo { 0% { opacity: .55; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.1) } }
    .halo { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2918"/><stop offset="1" stop-color="#101919"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="668" y1="0" x2="1160" y2="0"><stop offset="0.00" stop-color="#4d7c0f"/><stop offset="0.50" stop-color="#65a30d"/><stop offset="1.00" stop-color="#afd476"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#65a30d" stop-opacity="0"/><stop offset=".35" stop-color="#65a30d"/><stop offset="1" stop-color="#afd476"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="260" fill="url(#ground)"/>
    <g stroke="#2a4116" stroke-width="1" opacity=".5">
    <path d="M668 28V222"/>
    <path d="M738 28V222"/>
    <path d="M809 28V222"/>
    <path d="M879 28V222"/>
    <path d="M949 28V222"/>
    <path d="M1019 28V222"/>
    <path d="M1090 28V222"/>
    <path d="M1160 28V222"/>
    <path d="M668 28H1160"/>
    <path d="M668 93H1160"/>
    <path d="M668 157H1160"/>
    <path d="M668 222H1160"/>
    </g>
    <path class="draw" pathLength="100" d="M692.0 198.0 L747.5 173.7 L803.0 163.0 L858.5 140.6 L914.0 118.2 L969.5 116.8 L1025.0 107.9 L1080.5 71.2 L1136.0 56.0" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.30s"/>
    <circle class="halo" cx="1136.0" cy="56.0" r="13" fill="none" stroke="#afd476" stroke-width="2"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <g class="arrive" style="animation-delay:0.40s"><circle cx="692.0" cy="198.0" r="13" fill="#101919" stroke="#65a30d" stroke-width="2.5"/><text x="692.0" y="202.5" fill="#afd476">1</text></g>
    <g class="arrive" style="animation-delay:0.75s"><circle cx="747.5" cy="173.7" r="13" fill="#101919" stroke="#65a30d" stroke-width="2.5"/><text x="747.5" y="178.2" fill="#afd476">2</text></g>
    <g class="arrive" style="animation-delay:1.10s"><circle cx="803.0" cy="163.0" r="13" fill="#101919" stroke="#65a30d" stroke-width="2.5"/><text x="803.0" y="167.5" fill="#afd476">3</text></g>
    <g class="arrive" style="animation-delay:1.45s"><circle cx="858.5" cy="140.6" r="13" fill="#101919" stroke="#65a30d" stroke-width="2.5"/><text x="858.5" y="145.1" fill="#afd476">4</text></g>
    <g class="arrive" style="animation-delay:1.80s"><circle cx="914.0" cy="118.2" r="13" fill="#101919" stroke="#65a30d" stroke-width="2.5"/><text x="914.0" y="122.7" fill="#afd476">5</text></g>
    <g class="arrive" style="animation-delay:2.15s"><circle cx="969.5" cy="116.8" r="13" fill="#101919" stroke="#65a30d" stroke-width="2.5"/><text x="969.5" y="121.3" fill="#afd476">6</text></g>
    <g class="arrive" style="animation-delay:2.50s"><circle cx="1025.0" cy="107.9" r="13" fill="#101919" stroke="#65a30d" stroke-width="2.5"/><text x="1025.0" y="112.4" fill="#afd476">7</text></g>
    <g class="arrive" style="animation-delay:2.85s"><circle cx="1080.5" cy="71.2" r="13" fill="#101919" stroke="#65a30d" stroke-width="2.5"/><text x="1080.5" y="75.7" fill="#afd476">8</text></g>
    <g class="arrive" style="animation-delay:3.20s"><circle cx="1136.0" cy="56.0" r="13" fill="#101919" stroke="#65a30d" stroke-width="2.5"/><text x="1136.0" y="60.5" fill="#afd476">9</text></g>
    </g>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#365314"/><rect x="300.0" y="248" width="300.5" height="12" fill="#4d7c0f"/><rect x="600.0" y="248" width="300.5" height="12" fill="#65a30d"/><rect x="900.0" y="248" width="300.5" height="12" fill="#ecfccb"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="66.7" fill="#65a30d" font-size="15" font-weight="700" letter-spacing=".6">Wilson's Lawn Maintenance</text><text x="56" y="115.0" fill="#ecfccb" font-size="42" font-weight="700" letter-spacing="-.5">procedures, the public copy</text><text x="56" y="155.9" fill="#cfdeb2" font-size="23">Only the procedures the owner has listed for</text><text x="56" y="186.7" fill="#cfdeb2" font-size="23">visitors.</text></g>
  </g>
</svg>
